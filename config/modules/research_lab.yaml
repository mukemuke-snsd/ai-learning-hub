# 研究前沿模块 — 学术+技术视野
# LLM / Agent / RAG / Reasoning / Evals

module_name: "研究前沿"
module_id: "research_lab"
description: "跟踪 AI 前沿论文、技术博客和实验成果，保持学术敏锐度和技术判断力"

# =============================================
# Focus Topics — 跨模块学习主线（boost 加权）
# =============================================

focus_topics:
  geo:
    label: "GEO"
    keywords:
      - "GEO"
      - "generative engine optimization"
      - "AI search"
      - "AI overview"
      - "AI overviews"
      - "AI citation"
      - "llms.txt"
      - "perplexity"
      - "ChatGPT search"
      - "generative search"
      - "zero-click"
      - "AI visibility"
      - "schema markup"
      - "structured data"
      - "content optimization for AI"
      - "answer engine"
    boost: 2.0

  ai_agent:
    label: "AI Agent"
    keywords:
      - "AI agent"
      - "agentic"
      - "multi-agent"
      - "MCP"
      - "model context protocol"
      - "tool use"
      - "agent economy"
      - "agent-native"
      - "Claude Code"
      - "autonomous agent"
      - "agent workflow"
      - "agent orchestration"
      - "Cowork"
      - "plugin"
    boost: 2.0

# =============================================
# arXiv 配置（收紧后）
# =============================================

arxiv_categories:
  - "cs.CL"
  - "cs.AI"

arxiv_search_queries:
  - "ti:agent AND (ti:LLM OR ti:language model)"
  - "ti:retrieval augmented generation"
  - "ti:generative search optimization"
  - "ti:tool use AND ti:language model"
  - "ti:reasoning AND (ti:LLM OR ti:large language model)"
  - "ti:multi-agent AND ti:collaboration"

max_results_per_query: 5

