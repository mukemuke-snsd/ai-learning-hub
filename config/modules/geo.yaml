# arXiv 关键词（供 ArxivScraper(module='geo') 使用）
arxiv_categories:
  - "cs.IR"
  - "cs.AI"
  - "cs.CL"

arxiv_settings:
  max_results_per_query: 10
  sort_by: "submittedDate"
  sort_order: "descending"

